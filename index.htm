<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    

    <h1>Rock Paper Scissors</h1>

    <div class="choices">
      <div class="choice">
        <img src="rock.png" id="rock" >
      </div>

      <div class="choice">
        <img src="paper.png" id="paper">
      </div>

      <div class="choice">
        <img src="scissors.png" id="scissors">
      </div>
    </div>

    <div class="container">
      <div class="user">
        <p id="user-score">0</p>
        <p>You</p>
      </div>

      <div class="comp">
        <p id="comp-score">0</p>
        <p>Comp</p>
      </div>
    </div>

    <div class="result">
      <p id="result">Play Your Game</p>
    </div>












    <script src="script.js"></script>
  </body>
</html>
